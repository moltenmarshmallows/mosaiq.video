<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mosaiq is a video platform for subscription-based streaming.">
  <title>Mosaiq — Video streaming</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131d; color: #f5f6fa; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; max-width: 48rem; padding: 3rem 1.5rem; }
    .brand { color: #b5a7ff; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.05; margin: 1rem 0; }
    p { color: #c5c9d8; font-size: 1.2rem; line-height: 1.6; }
    a { display: inline-block; margin-top: 1rem; padding: .8rem 1.2rem; border-radius: .5rem; background: #b5a7ff; color: #10131d; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Mosaiq</div>
    <h1>Video streaming, brought together.</h1>
    <p>Mosaiq is a video platform for subscription-based streaming.</p>
    <a href="https://github.com/moltenmarshmallows/mosaiq">Explore the project on GitHub</a>
  </main>
</body>
</html>
